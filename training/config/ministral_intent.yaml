# Ministral Intent Classification Training Config
# QLoRA fine-tuning for TRIP/NOT_TRIP/UNKNOWN classification

model:
  # Unsloth-optimized variant: faster training, lower memory
  name: "unsloth/Ministral-3-3B-Base-2512-unsloth-bnb-4bit"
  max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0  # MUST be 0 for Unsloth fast patching
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/ministral-intent-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  weight_decay: 0.001
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: true
  logging_steps: 50
  eval_strategy: "steps"
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1"
  greater_is_better: true
  report_to: "none"  # Set to "wandb" or "mlflow" if needed

data:
  train_file: "datasets/base/train.json"
  val_file: "datasets/base/val.json"
  test_file: "datasets/base/test.json"
  max_length: 256
  num_labels: 3

# Optional: limit samples for testing
debug:
  num_train_samples: null  # Set to e.g. 1000 for quick testing
  num_val_samples: null
