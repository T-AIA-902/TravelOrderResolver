[tool.poetry]
name = "travel-order-resolver"
version = "0.1.0"
description = "Systeme intelligent de traitement de commandes de voyage en langage naturel pour le reseau ferroviaire SNCF"
authors = ["Epitech T9-AIA Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# NLP
spacy = "^3.7"
transformers = "^4.36"
torch = "^2.1"
datasets = "^2.16"
# Data processing
pandas = "^2.1"
numpy = "^1.26"
# Fuzzy matching
rapidfuzz = "^3.5"
unidecode = "^1.3"
# API
fastapi = "^0.108"
uvicorn = "^0.25"
pydantic = "^2.5"
# CLI
typer = "^0.9"
rich = "^13.7"
# Config
python-dotenv = "^1.0"
pyyaml = "^6.0"
# Logging
loguru = "^0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-asyncio = "^0.23"
black = "^23.12"
isort = "^5.13"
flake8 = "^6.1"
mypy = "^1.8"
pre-commit = "^3.6"
ipython = "^8.19"

[tool.poetry.group.ml.dependencies]
# Speech-to-text
openai-whisper = "^20231117"
# Experiment tracking
mlflow = "^2.9"
wandb = "^0.16"
# Carbon tracking
codecarbon = "^2.3"
# Fine-tuning
peft = "^0.7"
accelerate = "^0.25"

[tool.poetry.group.notebooks.dependencies]
jupyter = "^1.0"
matplotlib = "^3.8"
seaborn = "^0.13"
plotly = "^5.18"

[tool.poetry.scripts]
travel-resolver = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | models
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "models"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["models/", "notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["src/api/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
