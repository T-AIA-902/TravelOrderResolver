version: '3.8'

services:
  # Frontend (Vue 3 + Nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - app

  # Main application service (GPU-enabled)
  app:
    image: travel-order-resolver
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ../datasets/raw/sncf:/app/datasets/raw/sncf:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Interactive mode by default
    stdin_open: true
    tty: true

  # Evaluation service (run evaluations on GPU)
  evaluate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../datasets:/app/datasets:ro
      - ../src/evaluation/reports:/app/src/evaluation/reports
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "-m", "src.evaluation", "--eval-type", "all", "--device", "auto"]
    profiles:
      - evaluate

  # Training service (GPU required)
  training:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    volumes:
      - ../datasets:/app/datasets
      - ../models:/app/models
      - ../training:/app/training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - training

  # MLflow tracking server (optional)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    profiles:
      - mlops

volumes:
  mlflow_data:
