version: '3.8'

services:
  # Frontend (Vue 3 + Nginx)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - app

  # Main application service (GPU-enabled)
  app:
    image: travel-order-resolver
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ../datasets/raw/sncf:/app/datasets/raw/sncf:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Interactive mode by default
    stdin_open: true
    tty: true

  # Evaluation service (run evaluations on GPU)
  evaluate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../datasets:/app/datasets:ro
      - ../src/evaluation/reports:/app/src/evaluation/reports
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "-m", "src.evaluation", "--eval-type", "all", "--device", "auto"]
    profiles:
      - evaluate

  # Training service (GPU required)
  training:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    volumes:
      - ../datasets:/app/datasets
      - ../models:/app/models
      - ../training:/app/training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - training

  # MLflow tracking server (optional)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    profiles:
      - mlops

  # ==========================================================================
  # Monitoring stack (profile: monitoring)
  # ==========================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "49090:9090"
    volumes:
      - ../src/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana - Dashboards & visualization
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "43000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../src/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../src/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

  # Node Exporter - System metrics (CPU, RAM, disk, network)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - "49100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    profiles:
      - monitoring

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "48080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    profiles:
      - monitoring

  # Gatus - Health checks & uptime monitoring
  gatus:
    image: twinproduction/gatus:v5.8.0
    ports:
      - "48081:8080"
    volumes:
      - ../src/monitoring/gatus/config.yaml:/config/config.yaml:ro
    depends_on:
      - prometheus
      - grafana
      - node-exporter
      - cadvisor
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
